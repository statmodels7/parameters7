url: https://statmodels7.github.io/parameters7/

template:
  bootstrap: 5

reference:
- title: Families
  desc: >
    The parametrizations. Each maps an unconstrained vector onto its own
    constrained set: symmetric matrices, probability vectors or row-stochastic
    matrices. The consumer decides on which side of a model a matrix is used.
  contents:
  - log_cholesky
  - matrix_log
  - correlation_matrix
  - compound_symmetry
  - ar1
  - autoregressive
  - ar1_inv
  - Ar1InvParam
  - autoregressive_inv
  - AutoregressiveInvParam
  - diagonal_matrix
  - scalar_matrix
  - scaled_matrix
  - simplex
  - transition_matrix
  - kron_identity
  - KronIdentityParam
  - block_diag
  - BlockDiagParam
  - dr_prod
  - DrProdParam
  - sum_struct
  - SumStructParam
  - inverse_of
  - InverseParam

- title: The map and its inverse
  contents:
  - param_value
  - param_free

- title: Derivatives
  desc: >
    Exact to fourth order, on the unconstrained scale, as joint estimation over
    the coefficients and the constrained parameters requires.
  contents:
  - param_d1
  - param_d2
  - param_d3
  - param_d4
  - param_tuple_names
  - param_tuple_indices

- title: Log-determinant and solves
  desc: >
    The log-determinant, or the log pseudo-determinant when the family is rank
    deficient, and the solves, computed through a factor instead of through an
    explicit inverse.
  contents:
  - param_logdet
  - param_dlogdet
  - param_d2logdet
  - param_d3logdet
  - param_d4logdet
  - param_solve
  - param_inv_d1
  - param_inv_d2
  - param_factor

- title: Interpretable quantities
  desc: >
    The quantities that a family declares, with the Jacobian of the map from
    the free vector and the scale on which each interval is built, so that a
    consumer can report them by the delta method instead of reporting
    coordinates.
  contents:
  - param_readable

- title: Rank
  desc: >
    A rank read off an assembled matrix is not scale invariant, so it is
    computed once from the components and membership is tested against the null
    space that it implies.
  contents:
  - param_null_basis

- title: Tools
  contents:
  - check_parameter
  - param_is_numerical
  - numerical_d1
  - numerical_d2
  - numerical_d3
  - numerical_d4

- title: Classes
  desc: The S7 classes; each page lists the methods that dispatch on it.
  contents:
  - parameter
  - matrix_parameter
  - LogCholeskyParam
  - ends_with(".MatrixLogParam")
  - MatrixLogParam
  - CorrelationParam
  - ends_with(".CorrelationParam")
  - CompoundSymmetryParam
  - ends_with(".CompoundSymmetryParam")
  - Ar1Param
  - ends_with(".Ar1Param")
  - AutoregressiveParam
  - ends_with(".AutoregressiveParam")
  - SimplexParam
  - ends_with(".SimplexParam")
  - TransitionMatrixParam
  - ends_with(".TransitionMatrixParam")
  - ends_with(".LogCholeskyParam")
  - DiagMatrixParam
  - ends_with(".DiagMatrixParam")
  - ScaledMatrixParam
  - ends_with(".ScaledMatrixParam")

- title: Base-class defaults
  desc: >
    The methods registered on the base classes, which every parameter inherits
    unless it registers a method of its own.
  contents:
  - ends_with(".parameter")
  - ends_with(".matrix_parameter")

- title: Internals
  desc: >
    The internal functions from which the exported ones are built. They are
    not exported and are not needed to use the package; they are documented so
    that the derivations can be followed from the code that implements them.
  contents:
  - has_keyword("internal")

url: https://statmodels7.github.io/parameters7/

template:
  bootstrap: 5

reference:
- title: Families
  desc: >
    The parametrizations. Each maps an unconstrained vector to a matrix in its
    own constrained set, and each owns the side of that matrix.
  contents:
  - log_cholesky
  - matrix_log
  - correlation_matrix
  - compound_symmetry
  - ar1
  - autoregressive
  - diagonal_matrix
  - scalar_matrix
  - scaled_matrix
  - simplex
  - transition_matrix
  - kron_identity
  - KronIdentityParam

- title: The map and its inverse
  contents:
  - param_value
  - param_free

- title: Derivatives
  desc: >
    Exact to fourth order, on the unconstrained scale, which is what joint
    estimation over the coefficients and the constrained parameters consumes.
  contents:
  - param_d1
  - param_d2
  - param_d3
  - param_d4
  - param_tuple_names
  - param_tuple_indices

- title: What a likelihood asks of the matrix
  desc: >
    The log-determinant, or the log pseudo-determinant when the family is rank
    deficient, and the solves -- computed through a factor rather than through
    an explicit inverse.
  contents:
  - param_logdet
  - param_dlogdet
  - param_d2logdet
  - param_d3logdet
  - param_solve
  - param_factor

- title: What a reader reads
  desc: >
    The quantities a family is about, with the Jacobian of the map from the
    free vector and the scale each interval belongs on, so that a consumer can
    report them by the delta method rather than reporting coordinates.
  contents:
  - param_readable

- title: Rank
  desc: >
    A rank read off an assembled matrix is not scale invariant, so it is
    computed once from the components and membership is tested against the null
    space it implies.
  contents:
  - param_null_basis

- title: Tools
  contents:
  - check_parameter
  - param_is_numerical
  - numerical_d1
  - numerical_d2
  - numerical_d3
  - numerical_d4

- title: Classes
  desc: The S7 classes; each page lists the methods that dispatch on it.
  contents:
  - parameter
  - matrix_parameter
  - LogCholeskyParam
  - ends_with(".MatrixLogParam")
  - MatrixLogParam
  - CorrelationParam
  - ends_with(".CorrelationParam")
  - CompoundSymmetryParam
  - ends_with(".CompoundSymmetryParam")
  - Ar1Param
  - ends_with(".Ar1Param")
  - AutoregressiveParam
  - ends_with(".AutoregressiveParam")
  - SimplexParam
  - ends_with(".SimplexParam")
  - TransitionMatrixParam
  - ends_with(".TransitionMatrixParam")
  - ends_with(".LogCholeskyParam")
  - DiagMatrixParam
  - ends_with(".DiagMatrixParam")
  - ScaledMatrixParam
  - ends_with(".ScaledMatrixParam")

- title: Base-class defaults
  desc: >
    The methods registered on the abstract class, which every parameter
    inherits unless it registers something more specific.
  contents:
  - ends_with(".parameter")
  - ends_with(".matrix_parameter")

- title: Internals
  desc: >
    The machinery the exported functions are built from. None of it is
    exported, and none is needed to use the package; it is documented so that
    the derivations can be followed from the code that implements them.
  contents:
  - has_keyword("internal")
